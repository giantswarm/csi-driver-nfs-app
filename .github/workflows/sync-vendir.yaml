name: Sync vendir changes

on:
  push:
    branches:
      - 'renovate/vendir/**'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Run sync script and push
    runs-on: ubuntu-24.04
    # our own push triggers this workflow again. the sync is idempotent so the
    # second run pushes nothing, but skip it to save a run.
    if: "!startsWith(github.event.head_commit.message, 'chore: apply sync patches')"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          # pushing with a bot token re-triggers the checks on the pull request
          token: ${{ secrets.TAYLORBOT_GITHUB_ACTION }}

      - name: Install vendir
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "vendir"
          # repo: carvel-dev/vendir
          version: "0.46.0"
          download_url: "https://github.com/carvel-dev/vendir/releases/download/v${version}/vendir-linux-amd64"
          smoke_test: "${binary} --version"

      - name: Install jq
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "jq"
          # repo: jqlang/jq
          version: "jq-1.8.1"
          download_url: "https://github.com/jqlang/jq/releases/download/${version}/jq-linux-amd64"
          binary_new_name: "jq"
          smoke_test: "${binary} --version"

      - name: Install yq
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "yq"
          # repo: mikefarah/yq
          version: "4.50.1"
          download_url: "https://github.com/mikefarah/yq/releases/download/v${version}/yq_linux_amd64"
          binary_new_name: "yq"
          smoke_test: "${binary} --version"

      # the CRD patch compares the vendored CRDs against the default branch
      - name: Fetch the default branch
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: Run sync script
        run: ./sync/sync.sh

      - name: Update changelog
        run: ./sync/changelog.sh

      - name: Commit and push
        run: |
          git config --local user.email "dev@giantswarm.io"
          git config --local user.name "taylorbot"
          git add --all
          if git diff --cached --quiet ; then
              echo "No changes after sync; nothing to push."
              exit 0
          fi
          git commit -m "chore: apply sync patches"
          git push origin "HEAD:${{ github.ref_name }}"
